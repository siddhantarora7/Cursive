<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursive · Type half. Tab the rest.</title>
    <meta
      name="description"
      content="Ghost text finishes your sentence in your own voice. Press Tab and keep going. A free writing editor in your browser, no signup."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/cursive-logo.png" />
    <meta name="theme-color" content="#FDFCF0" />

    <!-- Open Graph / Twitter. The image paths are rewritten to absolute URLs at
         build time (see absoluteSocialImages in vite.config.ts) from SITE_URL
         or Vercel's production domain; several crawlers ignore relative ones.
         Keep them root-relative here so local builds still resolve. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cursive" />
    <meta property="og:title" content="Cursive · Type half. Tab the rest." />
    <meta
      property="og:description"
      content="Ghost text finishes your sentence in your own voice. Press Tab and keep going. Free, in your browser, no signup."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cursive · Type half. Tab the rest." />
    <meta
      name="twitter:description"
      content="Ghost text finishes your sentence in your own voice. Press Tab and keep going. Free, in your browser, no signup."
    />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
